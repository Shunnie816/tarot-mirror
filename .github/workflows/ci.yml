name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # このプロジェクトの中心的な不変条件。
      # ネットワークも API キーもない CI 環境で読み物が完成することを毎回確かめる。
      # ここが落ちたらコスト戦略が壊れているので、テストとは別に可視化しておく。
      - name: A reading must complete without an LLM
        run: pnpm demo:reading ci-smoke
