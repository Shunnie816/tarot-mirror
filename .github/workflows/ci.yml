name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Function だけは束ねてからデプロイされる。ワークスペースのパッケージは
      # ビルド無しの TypeScript なので、束ね方が壊れても test も typecheck も
      # 気づかない。気づくのがデプロイの瞬間になるくらいなら、毎回束ねておく。
      - name: The function must still bundle
        run: pnpm build:functions

      # デプロイ先は npm で入れる。ワークスペースの記法（workspace:*）が
      # functions/package.json に紛れ込むと、npm がマニフェストを読んだ時点で
      # 落ちる。pnpm で開発しているとローカルでは一度も踏まないので、
      # 気づく場所をここに作っておく（Issue #36）。
      - name: The function's manifest must install with npm
        run: |
          rm -rf /tmp/deploy-manifest
          mkdir -p /tmp/deploy-manifest
          cp functions/package.json /tmp/deploy-manifest/
          cd /tmp/deploy-manifest
          npm install --omit=dev --no-audit --no-fund

      # セキュリティルールは実際に動かさないと確かめられない。
      # 「他人の uid では読めない」が壊れていないことを毎回踏む。
      # Firestore エミュレータは JDK を要求する。ランナー既定の Java に
      # 依存すると、その入れ替えで静かに壊れるので版を固定する。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore rules and saving
        run: npx --yes firebase-tools@15 emulators:exec --only firestore "npx vitest run --workspace vitest.firestore.workspace.ts"

      # このプロジェクトの中心的な不変条件。
      # ネットワークも API キーもない CI 環境で読み物が完成することを毎回確かめる。
      # ここが落ちたらコスト戦略が壊れているので、テストとは別に可視化しておく。
      - name: A reading must complete without an LLM
        run: pnpm demo:reading ci-smoke
